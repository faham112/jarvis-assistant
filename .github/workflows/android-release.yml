name: MJ Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_DIR: mj-native

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.0.1"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mj-native/package-lock.json

      - name: Install app dependencies
        working-directory: mj-native
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: mj-native
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Find completed build
        id: build
        working-directory: mj-native
        shell: bash
        run: |
          build_id="$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].id')"
          if [[ -z "$build_id" || "$build_id" == "null" ]]; then
            echo "Could not find completed EAS build"
            exit 1
          fi
          echo "id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Download APK
        working-directory: mj-native
        run: eas build:download --build-id "${{ steps.build.outputs.id }}" --non-interactive

      - name: Rename APK
        shell: bash
        run: |
          apk="$(find "$APP_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "EAS did not produce an APK"
            exit 1
          fi
          mv "$apk" "$APP_DIR/mj-${{ steps.release.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: MJ ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: mj-native/mj-${{ steps.release.outputs.tag }}.apk
